name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar app e instalador
        shell: powershell
        run: ./installer/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCleaner
          path: dist/*
