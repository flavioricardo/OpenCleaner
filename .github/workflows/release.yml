name: Release

# On a vX.Y.Z tag push, builds the installer and the portable version and publishes the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./installer/build-installer.ps1 -Version $version

      - name: Publicar release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          ./.github/write-release-notes.ps1 -Tag $tag -Repo $env:GITHUB_REPOSITORY -Sums dist/SHA256SUMS.txt -Out notes.md
          gh release create $tag dist/OpenCleaner-Setup.exe dist/OpenCleaner-portable.zip dist/SHA256SUMS.txt --title "OpenCleaner $tag" --notes-file notes.md
