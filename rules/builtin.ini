Group=Sistema
Item=Relatório de erros do Windows
Default=True
FileKey1=%CommonAppData%\Microsoft\Windows\WER\ReportArchive\*|*.*|REMOVESELF
FileKey2=%CommonAppData%\Microsoft\Windows\WER\ReportQueue\*|*.*|REMOVESELF
FileKey3=%LocalAppData%\Microsoft\Windows\WER\ReportArchive\*|*.*|REMOVESELF
FileKey4=%LocalAppData%\Microsoft\Windows\WER\ReportQueue\*|*.*|REMOVESELF

[Sistema - DNS]
Category=Windows
Group=Sistema
Item=Cache de DNS
Default=True
Special=DnsCache

[Sistema - Otimização de entrega]
