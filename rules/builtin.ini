; FreeCleaner - regras de limpeza embutidas
;
; Formato compatível com winapp2.ini (FileKey, RegKey, ExcludeKey, Detect, DetectFile),
; com chaves extras:
;   Category=     aba da árvore (Windows | Navegadores | Aplicativos)
;   Group=        grupo dentro da aba
;   Item=         nome do item
;   Special=      RecycleBin | DnsCache | Clipboard
;   Process=      processos que travam os arquivos (separados por ;)
;   TempAge=True  respeita a opção "apenas arquivos com mais de 24 horas"
;   MinAgeHours=  idade mínima dos arquivos removidos
;   Warning=      aviso exibido ao marcar o item
;
; FileKey: pasta|padrões;separados|RECURSE|REMOVESELF  (curingas valem em segmentos da pasta)
; Os navegadores Chromium (Chrome, Edge, Brave, Vivaldi, Opera) são gerados em Rules.cs.

; ===================== Windows - Explorador =====================

[Explorer - Documentos recentes]
Category=Windows
Group=Explorador do Windows
Item=Documentos recentes
Default=False
FileKey1=%AppData%\Microsoft\Windows\Recent|*.lnk

[Explorer - Executar]
Category=Windows
Group=Explorador do Windows
Item=Executar (menu Iniciar)
Default=False
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU

[Explorer - Outros MRUs]
Category=Windows
Group=Explorador do Windows
Item=Outras listas de itens recentes
Default=False
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths
RegKey2=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\ComDlg32\OpenSavePidlMRU
RegKey3=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\ComDlg32\LastVisitedPidlMRU
RegKey4=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\WordWheelQuery

[Explorer - Miniaturas]
Category=Windows
Group=Explorador do Windows
Item=Cache de miniaturas
Default=True
FileKey1=%LocalAppData%\Microsoft\Windows\Explorer|thumbcache_*.db

[Explorer - Listas de atalhos]
Category=Windows
Group=Explorador do Windows
Item=Listas de atalhos da barra de tarefas
Default=False
FileKey1=%AppData%\Microsoft\Windows\Recent\AutomaticDestinations|*.automaticDestinations-ms
FileKey2=%AppData%\Microsoft\Windows\Recent\CustomDestinations|*.customDestinations-ms

; ===================== Windows - Sistema =====================

[Sistema - Lixeira]
Category=Windows
Group=Sistema
Item=Esvaziar Lixeira
Default=True
Special=RecycleBin

[Sistema - Temporários]
Category=Windows
Group=Sistema
Item=Arquivos temporários
Default=True
TempAge=True
FileKey1=%Temp%|*.*
FileKey2=%Temp%\*|*.*|REMOVESELF
FileKey3=%WinDir%\Temp|*.*
FileKey4=%WinDir%\Temp\*|*.*|REMOVESELF

[Sistema - Área de transferência]
Category=Windows
Group=Sistema
Item=Área de transferência
Default=False
Special=Clipboard

[Sistema - Despejos de memória]
