; ===================== Navegadores =====================

[Firefox - Cache]
Category=Navegadores
Group=Mozilla Firefox
Item=Cache da internet
Default=True
Process=firefox
DetectFile=%AppData%\Mozilla\Firefox\Profiles
FileKey1=%LocalAppData%\Mozilla\Firefox\Profiles\*\cache2|*.*|RECURSE
FileKey2=%LocalAppData%\Mozilla\Firefox\Profiles\*\startupCache|*.*|RECURSE
FileKey3=%LocalAppData%\Mozilla\Firefox\Profiles\*\thumbnails|*.*|RECURSE
FileKey4=%LocalAppData%\Mozilla\Firefox\Profiles\*\jumpListCache|*.*

[Firefox - Cookies]
Category=Navegadores
Group=Mozilla Firefox
Item=Cookies
Default=False
