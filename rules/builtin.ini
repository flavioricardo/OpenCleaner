; OpenCleaner - regras de limpeza embutidas
;
; Formato compatível com winapp2.ini (FileKey, RegKey, ExcludeKey, Detect, DetectFile),
; com chaves extras:
;   Category=     aba da árvore (Windows | Navegadores | Aplicativos)
;   Group=        grupo dentro da aba
;   Item=         nome do item
;   Special=      RecycleBin | DnsCache | Clipboard
;   Process=      processos que travam os arquivos (separados por ;)
;   TempAge=True  respeita a opção "apenas arquivos com mais de 24 horas"
;   MinAgeHours=  idade mínima dos arquivos removidos
;   Warning=      aviso exibido ao marcar o item
;
; FileKey: pasta|padrões;separados|RECURSE|REMOVESELF  (curingas valem em segmentos da pasta)
; Os navegadores Chromium (Chrome, Edge, Brave, Vivaldi, Opera) são gerados em Rules.cs.

; ===================== Windows - Explorador =====================

[Explorer - Documentos recentes]
Category=Windows
Group=Explorador do Windows
GroupEn=Windows Explorer
Item=Documentos recentes
ItemEn=Recent documents
Default=False
FileKey1=%AppData%\Microsoft\Windows\Recent|*.lnk

