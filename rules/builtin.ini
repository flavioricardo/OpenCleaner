FileKey2=%WinDir%\Minidump|*.dmp
FileKey3=%LocalAppData%\CrashDumps|*.dmp

[Sistema - Chkdsk]
Category=Windows
Group=Sistema
Item=Fragmentos de arquivos do Chkdsk
Default=True
